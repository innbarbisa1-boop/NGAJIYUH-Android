plugins { id 'com.android.application' }

android {
    namespace 'com.ngajiyuh.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ngajiyuh.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
}
